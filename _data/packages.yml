# Authoritative tracked-package registry for cve.ribose.com OSV and GHSA feeds.
# Aligned with ribosei/provenance-instance (config/provenance.yaml).
packages:
  - repo: rnpgp/rnp
    org: rnpgp
    name: rnp
    tier: A
    release_stream: "0.18.x"
    ecosystem: GIT
    package_name: rnpgp/rnp
    purl: pkg:github/rnpgp/rnp
    product_names:
      - RNP
      - rnpgp/rnp
    repo_urls:
      - https://github.com/rnpgp/rnp
    osv_feed_path: /feeds/osv/rnp.json
    ghsa_feed_path: /feeds/ghsa/rnp.json
    csaf_feed_path: /feeds/csaf/rnp.json
    vex_feed_path: /feeds/vex/rnp.json

  - repo: metanorma/metanorma
    org: metanorma
    name: metanorma
    tier: A
    release_stream: "2.5.x"
    ecosystem: RubyGems
    package_name: metanorma
    purl: pkg:gem/metanorma
    product_names:
      - metanorma
      - Metanorma
    repo_urls:
      - https://github.com/metanorma/metanorma
    osv_feed_path: /feeds/osv/metanorma.json
    ghsa_feed_path: /feeds/ghsa/metanorma.json
    csaf_feed_path: /feeds/csaf/metanorma.json
    vex_feed_path: /feeds/vex/metanorma.json

  - repo: riboseinc/cla
    org: riboseinc
    name: cla
    tier: A
    release_stream: "1.x"
    ecosystem: GIT
    package_name: riboseinc/cla
    purl: pkg:github/riboseinc/cla
    product_names:
      - cla
      - CLA
    repo_urls:
      - https://github.com/riboseinc/cla
    osv_feed_path: /feeds/osv/cla.json
    ghsa_feed_path: /feeds/ghsa/cla.json
    csaf_feed_path: /feeds/csaf/cla.json
    vex_feed_path: /feeds/vex/cla.json

  - repo: ribosei/identity
    org: ribosei
    name: identity
    tier: A
    release_stream: "0.4.x"
    ecosystem: GIT
    package_name: ribosei/identity
    purl: pkg:github/ribosei/identity
    product_names:
      - identity
    repo_urls:
      - https://github.com/ribosei/identity
    osv_feed_path: /feeds/osv/identity.json
    ghsa_feed_path: /feeds/ghsa/identity.json
    csaf_feed_path: /feeds/csaf/identity.json
    vex_feed_path: /feeds/vex/identity.json
