title: Ribose CNA
description: CVE Naming Authority for Ribose products
# The above two are used by jekyll-seo-tag for things such as
# `<title>` and `<meta>` tags, as well as elsewhere by the theme.

permalink: /blog/:year-:month-:day-:title/

tagline: >-
  Ribose CVE Naming Authority

landing_priority:
  - advisories
  - feedback

pitch: >-
  CVEs issued by the Ribose CNA.

author: "Ribose Inc."

authors:
  - name: Ribose Inc.
    email: security.team@ribose.com

contact_email: security.team@ribose.com

theme: jekyll-theme-rop

parent_hub:
  git_repo_url: https://github.com/riboseinc/open.ribose.com
  home_url: https://open.ribose.com/

includes_dir: '.'

social:
  links:
    - https://twitter.com/RiboseUS
    - https://github.com/riboseinc

legal:
  name: Ribose Group Inc.
  tos_link: https://www.ribose.com/tos
  privacy_policy_link: https://www.ribose.com/privacy

home_calls_to_action:
  - { url: "/advisories/", title: "Advisories" }

collections:
  projects:
    output: false
  software:
    output: false
  specs:
    output: false
  advisories:
    output: true
    permalink: /advisories/:slug/
  posts:
    output: false
    permalink: /blog/:year-:month-:day-:title/
  pages:
    output: true
    permalink: /:name/

defaults:
  # Theme defaults.
  # MUST be duplicated from theme’s _config.yml
  # (does not get inherited, unlike the collections hash)
  - scope:
      path: ""
    values:
      layout: default
  # - scope:
  #     path: _posts
  #     type: posts
  #   values:
  #     layout: post
  - scope:
      path: _advisories
      type: advisories
    values:
      layout: post
  - scope:
      path: _software
      type: software
    values:
      layout: product
  - scope:
      path: _specs
      type: specs
    values:
      layout: spec

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

url: https://cve.ribose.com

github_repo_url: https://github.com/riboseinc/

exclude:
  - .git
  - parent-hub/.git
  - Gemfile*
  - Makefile
  - Rakefile
  - README.adoc
  - schemas
  - scripts
  - test
  - vendor # for deployment
